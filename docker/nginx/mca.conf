# Local dev nginx config — mirrors production /etc/nginx/conf.d/mca.conf
# minus the certbot/TLS block. Keep rewrite rules in sync with production
# whenever they change.

server {
    listen 80 default_server;
    server_name localhost;

    root /var/www/mca;
    index index.php index.html;

    # Friendly site-wide 404 (overridden by per-location error_page on /api/v1/*)
    error_page 404 /404.php;

    # Block direct HTTP access to credential files
    location ~ ^/(db_connect|db_connect_template|db_review_connect)\.php$ {
        deny all;
        return 404;
    }

    # Clean passport URLs: /MCA-BAC-000001 -> /passport.php?id=MCA-BAC-000001
    location ~ "^/(MCA-[A-Z]+-[0-9]+)/?$" {
        rewrite ^/(MCA-[A-Z]+-[0-9]+)/?$ /passport.php?id=$1 last;
    }

    # Canonical: redirect external /foo.php -> /foo (and /index.php -> /).
    # Internal rewrites from @php_clean_url leave $request_uri as the clean
    # URL, so we only redirect when the original request URI ended in .php.
    # Excludes /passport.php (internal target of the MCA-XXX rewrite) and
    # AJAX endpoints which must execute as-is.
    location = /index.php {
        if ($request_uri ~ "^/index\.php(\?|$)") {
            return 301 /;
        }
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ "^/(about|passports|pathway_search|glossary|literature|search|search_help)\.php$" {
        set $clean_path /$1;
        if ($request_uri ~ "\.php(\?|$)") {
            return 301 $clean_path;
        }
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Public read-only API v1 (static JSON, no PHP, no DB) ─────────────
    # /api/v1/passports/MCA-BAC-000001  -> web/api/v1/passports/MCA-BAC-000001.json
    location ~ "^/api/v1/passports/(MCA-[A-Z]+-[0-9]+)/?$" {
        try_files /api/v1/passports/$1.json =404;
        error_page 404 /api/v1/_404.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # /api/v1/meta -> web/api/v1/meta.json
    location = /api/v1/meta {
        try_files /api/v1/meta.json =404;
        error_page 404 /api/v1/_404.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Catch any other /api/v1/* path (typos, wrong endpoint, wrong version)
    location /api/v1/ {
        return 404;
        error_page 404 /api/v1/_404.json;
    }
    # Internal-only — body of all API 404 responses (served via error_page).
    location = /api/v1/_404.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Extensionless PHP. Note: $uri.php in try_files would serve the .php
    # file as static (octet-stream) — must rewrite via @php_clean_url so the
    # request re-enters location matching and hits the .php handler below.
    location / {
        try_files $uri $uri/ @php_clean_url;
    }
    location @php_clean_url {
        rewrite ^(.+)$ $1.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        # Container hostname `php` resolves via the docker network.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
